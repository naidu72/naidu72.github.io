document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:1px solid #252d40;border-radius:3px;color:#8892a4\">Raspbian<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;background:#151820;border:1px solid #252d40;border-radius:3px;color:#8892a4\">HP-UX<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;background:#151820;border:1px solid #252d40;border-radius:3px;color:#8892a4\">Windows Server<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;background:#151820;border:1px solid #252d40;border-radius:3px;color:#8892a4\">macOS<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;background:#151820;border:1px solid #252d40;border-radius:3px;color:#8892a4\">VMware ESXi<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- EXPERIENCE -->\n<section id=\"experience\" data-screen-label=\"Experience\" style=\"max-width:1120px;margin:0 auto;padding:2rem clamp(1rem,4vw,2rem) 5rem\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#00ff88;letter-spacing:.15em;text-transform:uppercase;margin-bottom:.5rem\">// 03. experience<\u002Fdiv>\n  <h2 style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(1.4rem,3vw,2rem);font-weight:700;color:#fff;margin:0 0 1.6rem\">git log <span style=\"color:#00ff88\">--oneline<\u002Fspan><\u002Fh2>\n  <div style=\"height:1px;background:linear-gradient(90deg,#00ff88,transparent);opacity:.35;margin-bottom:2.5rem\"><\u002Fdiv>\n\n  <div style=\"position:relative;display:flex;flex-direction:column;gap:2.6rem;padding-left:2rem;border-left:1px solid #1e2330\">\n\n    <div style=\"position:relative\">\n      <span style=\"position:absolute;left:-2.32rem;top:.55rem;width:9px;height:9px;border-radius:50%;background:#00ff88;box-shadow:0 0 10px #00ff88\"><\u002Fspan>\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:#fff\">Frontier Communications<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#00d4ff;margin-top:.2rem\">Solutions Architect / DevOps Engineer — AI/ML &amp; Kubernetes Platform<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#f5a623;padding:3px 10px;border:1px solid rgba(245,166,35,.3);border-radius:3px;background:rgba(245,166,35,.05);white-space:nowrap\">Nov 2024 – Present<\u002Fspan>\n      <\u002Fdiv>\n      <ul style=\"list-style:none;margin:.9rem 0 0;padding:0;display:flex;flex-direction:column;gap:.35rem\">\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Build and manage AWS EKS clusters using Terraform to support microservices at scale, enabling Blue/Green deployments across QAT, PPRD, and Production environments.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Implemented full logging pipeline: Fluent-bit → Amazon MSK (Kafka) → Logstash → Elasticsearch → Kibana for centralized observability.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Managed and promoted Application Catalog &amp; CPQ solutions across cloud environments; collaborated with DevOps, QA, and App teams on deployment issues.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Set up AKS clusters with automated deployments using Terraform &amp; Ansible; integrated Azure DevOps for CD — improving application uptime by 20%.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Configured Azure Virtual Networks, Firewalls, Security Groups, and IAM roles/policies; optimized Azure VMs, volumes, and NSGs.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Authored nested CloudFormation templates with parameterization and cross-stack references; used StackSets for multi-account/multi-region governance and Change Sets to preview changes before execution.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Integrated CloudFormation with AWS Systems Manager Parameter Store for dynamic configuration injection, and enforced drift detection on critical production stacks.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Migrated on-premises applications to AWS EKS with minimal downtime; deployed and maintained Redis clusters for high availability and caching.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Designed end-to-end CI/CD pipelines in Jenkins and GitHub Actions with automated build, test, security scanning, and deployment stages.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"position:relative\">\n      <span style=\"position:absolute;left:-2.32rem;top:.55rem;width:9px;height:9px;border-radius:50%;background:#00ff88;box-shadow:0 0 10px #00ff88\"><\u002Fspan>\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:#fff\">Harman Connected Services<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#00d4ff;margin-top:.2rem\">Lead Engineer — Kubernetes Platform / SRE<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#f5a623;padding:3px 10px;border:1px solid rgba(245,166,35,.3);border-radius:3px;background:rgba(245,166,35,.05);white-space:nowrap\">Sep 2019 – Nov 2023<\u002Fspan>\n      <\u002Fdiv>\n      <ul style=\"list-style:none;margin:.9rem 0 0;padding:0;display:flex;flex-direction:column;gap:.35rem\">\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Sole admin for 10+ environments running Kubernetes on AWS; managed monitoring (Prometheus/Grafana) and logging (Graylog/Elasticsearch) stacks.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Delivered zero-downtime deployments (rolling updates) with 10–100 releases/day across environments serving 500+ pods each.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Authored Kubernetes manifests for StatefulSets, DaemonSets, PVCs, ServiceAccounts, RBAC, and Service Monitors.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Installed and configured F5 BIG-IP load balancer virtual instances across AWS accounts; managed microservices in production environments.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Set up Alertmanager, Opsgenie, and SES-based incident notification pipelines; built custom Grafana dashboards for node, pod, and application-level metrics.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Administered Jenkins at enterprise scale — plugin management, RBAC, agent provisioning, HA setup — and built reusable shared pipeline libraries standardizing build and deploy workflows across teams.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Provisioned secrets in HashiCorp Vault integrated with External Secrets Operator to sync into Kubernetes, eliminating hardcoded credentials and manual rotation.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Maintained ChartMuseum as the Helm chart repository for every microservice; monitored Kafka, Zookeeper, HiveMQ, MongoDB, Redis, and Sentinel on Kubernetes.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"position:relative\">\n      <span style=\"position:absolute;left:-2.32rem;top:.55rem;width:9px;height:9px;border-radius:50%;background:#00ff88;box-shadow:0 0 10px #00ff88\"><\u002Fspan>\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:#fff\">Microfocus (HPE)<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#00d4ff;margin-top:.2rem\">Service Delivery Consultant III<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#f5a623;padding:3px 10px;border:1px solid rgba(245,166,35,.3);border-radius:3px;background:rgba(245,166,35,.05);white-space:nowrap\">Mar 2017 – Sep 2019<\u002Fspan>\n      <\u002Fdiv>\n      <ul style=\"list-style:none;margin:.9rem 0 0;padding:0;display:flex;flex-direction:column;gap:.35rem\">\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Containerized enterprise solutions using Docker and Kubernetes on AWS; automated cloud infrastructure with Ansible, Terraform, and CloudFormation.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Built multi-VPC environments with public/private subnets, ELBs, Auto Scaling Groups, Route53, IAM, S3, RDS, and CloudWatch.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Designed and implemented reusable Terraform modules and Ansible roles, standardizing infrastructure components across projects.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Created reproducible builds of the Kubernetes applications and managed Kubernetes manifest files, Kubernetes charts using Helm and releases of Helm packages.<\u002Fli>\n        <li style=\"font-size:14px;color:#8892a4;padding-left:1.2rem;position:relative;line-height:1.65;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#00ff88;font-size:10px\">▸<\u002Fspan>Served as a subject matter expert on the execution and delivery of Cloud Integration and Transformation projects using cloud enabling technologies as well as orchestration and management approaches and tools Terraform and Ansible<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"position:relative\">\n      <span style=\"position:absolute;left:-2.32rem;top:.55rem;width:9px;height:9px;border-radius:50%;background:#00ff88;box-shadow:0 0 10px #00ff88\"><\u002Fspan>\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;color:#fff\">Samsung<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#00d4ff;margin-top:.2rem\">Lead Engineer<\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#f5a623;padding:3px 10px;border:1px solid rgba(245,166,35,.3);border-radius:3px;backgrou this.setState({ clock: 'uptime — ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' ' });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onResize);\n    this.timer = setInterval(this.tick, 1000);\n    this.onResize();\n    this.onScroll();\n    this.tick();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onResize);\n    clearInterval(this.timer);\n  }\n\n  renderVals() {\n    const wide = this.state.wide;\n    return {\n      scanlines: this.props.scanlines ?? true,\n      showHomelab: this.props.showHomelab ?? true,\n      progress: this.state.progress,\n      clock: (this.props.liveUptime ?? true) ? this.state.clock : '',\n      menuOpen: this.state.menuOpen && !wide,\n      deskNav: wide ? 'block' : 'none',\n      mobBtn: wide ? 'none' : 'flex',\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
